[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-studio"
version = "0.2.0"
description = "High-performance multimodal video generation studio powered by MiniMax-H3 and Apple Silicon Metal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "H3 Studio Community" }
]
keywords = [
    "video-generation",
    "minimax-h3",
    "apple-silicon",
    "metal",
    "diffusion-models",
    "storyboard",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
tools = [
    "torch>=2.1.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.6",
]

[project.scripts]
h3-studio = "pipeline.h3_storyboard_pipeline:main"

[project.urls]
Homepage = "https://github.com/h3-studio/h3-studio"
Documentation = "https://github.com/h3-studio/h3-studio#readme"
Repository = "https://github.com/h3-studio/h3-studio.git"
Issues = "https://github.com/h3-studio/h3-studio/issues"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "film-chain",
    "*.ipynb",
]

[tool.ruff.lint]
# Mandatory blocking rules for CI (thresholds follow docs/STANDARDS.md)
select = ["E", "F", "I", "B", "C901", "PLR0912", "PLR0913", "PLR0915"]
ignore = ["E501"]

# Tech-debt baseline: legacy files exempt from complexity/size gates.
# Shrink this list as files are refactored; NEVER add new files here.
[tool.ruff.lint.per-file-ignores]
"pipeline/h3_storyboard_pipeline.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"pipeline/h3_gdrive_sync.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"pipeline/h3_runner.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"comfy_nodes/comfy_h3_bridge/__init__.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"engines/h3.c/tools/fold_turbo_lora.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# PLR0915 counts statements (not lines): 50 statements is a proxy for the 50-line rule.
max-args = 3
max-statements = 50
